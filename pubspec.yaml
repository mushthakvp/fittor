name: fittor
description: A comprehensive Flutter package for creating responsive UIs that adapt to different screen sizes and orientations. A lightweight, intuitive state management solution for Flutter applications.
version: 1.0.8
repository: https://github.com/mushthakvp/fittor
issue_tracker: https://github.com/mushthakvp/fittor/issues
license: MIT

funding:
  - https://github.com/sponsors/mushthakvp

topics:
  - responsive
  - connectivity
  - key-value-storage
  - state-management
  - currency-formatting

environment:
  sdk: ^3.7.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:

  assets:
    - assets/

  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf

