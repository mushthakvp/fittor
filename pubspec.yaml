name: fittor
description: A comprehensive Flutter package for creating responsive UIs that adapt to different screen sizes and orientations.
version: 1.0.6
repository: https://github.com/mushthakvp/fittor
issue_tracker: https://github.com/mushthakvp/fittor/issues
license: MIT

funding:
  - https://github.com/sponsors/mushthakvp

topics:
  - responsive
  - connectivity
  - ui-design
  - layout
  - adaptive

environment:
  sdk: ^3.7.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

screenshots:
  - description: Fitter
    path: assets/icon.png

flutter:

  assets:
    - assets/

