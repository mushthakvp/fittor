name: fittor
description: A Flutter package for responsive UIs and state management. Adapts to screen sizes and orientations.
version: 1.0.14
repository: https://github.com/mushthakvp/fittor
license: MIT

funding:
  - https://github.com/sponsors/mushthakvp

topics:
  - responsive
  - connectivity
  - key-value-storage
  - state-management
  - currency-formatting

environment:
  sdk: ^3.7.2
  flutter: ">=1.17.0"

dependencies:
  args: ^2.7.0
  flutter:
    sdk: flutter
  path: ^1.9.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

executables:
  fittor: fittor

flutter:
  assets:
    - assets/