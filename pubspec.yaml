name: fittor
description: A Flutter package for responsive UIs and state management. Adapts to screen sizes and orientations.
version: 1.0.26
repository: https://github.com/mushthakvp/fittor
license: MIT

funding:
  - https://github.com/sponsors/mushthakvp

topics:
  - responsive
  - connectivity
  - key-value-storage
  - state-management
  - currency-formatting

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  web:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  assets:
    - assets/
    - web/js/