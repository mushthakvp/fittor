name: fittor
description: A Flutter package for responsive UIs and state management. Adapts to screen sizes and orientations.
version: 1.0.19
repository: https://github.com/mushthakvp/fittor
license: MIT

funding:
  - https://github.com/sponsors/mushthakvp

topics:
  - responsive
  - connectivity
  - key-value-storage
  - state-management
  - currency-formatting

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  args: ^2.5.0
  flutter:
    sdk: flutter
  path: ^1.8.3
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

executables:
  fittor: fittor

flutter:
  assets:
    - assets/